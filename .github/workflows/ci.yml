name: employee-portal-ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Production build (fails if VITE_API_URL would point at localhost)
        run: npm run build
        env:
          VITE_API_URL: https://api.koshpal.com/api/v1
